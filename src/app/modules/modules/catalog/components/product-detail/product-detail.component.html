<app-navbar></app-navbar>

<main class="detail-container">

  <app-loading
    *ngIf="loading"
    message="Cargando producto..."
  ></app-loading>

  <app-error-state
    *ngIf="error && !loading"
    message="No fue posible cargar el producto."
  ></app-error-state>

  <section
    class="product-detail"
    *ngIf="product && !loading && !error"
  >

    <div class="image-container">

      <img
        [src]="product.image || 'assets/images/product-placeholder.png'"
        [alt]="product.name"
      >

    </div>

    <div class="information">

      <span class="category">
        {{ product.category }}
      </span>

      <h1>{{ product.name }}</h1>

      <p class="description">
        {{ product.description }}
      </p>

      <div class="price">
        ${{ product.price | number:'1.0-0' }}
      </div>

      <div class="stock">
        Stock disponible: {{ product.stock }}
      </div>

      <button
        mat-raised-button
        color="primary"
        (click)="addToWishlist()"
      >
        <mat-icon>favorite</mat-icon>
        Agregar a wishlist
      </button>

    </div>

  </section>

</main>

<app-footer></app-footer>
