<p>product-card works!</p>
<mat-card class="product-card">
  <img mat-card-image [src]="product.image" [alt]="product.name">
  <mat-card-header>
    <mat-card-title>{{ product.name }}</mat-card-title>
    <mat-card-subtitle>{{ product.category }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p class="price">${{ product.price }}</p>
    <p>Stock: {{ product.stock }}</p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button color="primary" [routerLink]="['/catalog/product', product.id]">Detalle</a>
    <button mat-icon-button color="warn" (click)="onWishlistClick()">
      <mat-icon>favorite_border</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
